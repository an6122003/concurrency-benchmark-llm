<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON SPARK</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#03000a;height:100%;}
  canvas{display:block;cursor:crosshair;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ================= CORE ================= */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,horizonY=0;
let stars=[],mtnBack=[],mtnFront=[],sunCanvas=null,sunR=100,scanC=null;
let gridScroll=0,time=0,frameDt=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizonY=H*0.62;
  sunR=Math.min(W,H)*0.28;
  buildStars();buildMountains();buildSun();buildScan();
  if(player){player.y=H*0.86;if(player.tx>W)player.tx=W/2;}
}
window.addEventListener('resize',resize);
window.addEventListener('contextmenu',e=>e.preventDefault());

function buildStars(){
  stars=[];const n=Math.floor(W*H/6500);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*horizonY*0.95,
    r:Math.random()*1.6+0.4,ph:Math.random()*6.28,sp:Math.random()*2+0.5,
    c:Math.random()<0.15?'255,210,255':(Math.random()<0.5?'200,240,255':'255,255,255')});
}
function ridge(peak,step){
  const p=[];let x=-60;
  while(x<W+60){p.push({x:x,y:horizonY-(0.25+0.75*Math.random())*peak});x+=step;}
  p.push({x:W+60,y:horizonY});
  return p;
}
function buildMountains(){mtnBack=ridge(H*0.30,110);mtnFront=ridge(H*0.17,80);}
function buildSun(){
  const pad=80,size=Math.ceil(sunR*2+pad);
  sunCanvas=document.createElement('canvas');sunCanvas.width=sunCanvas.height=size;
  const s=sunCanvas.getContext('2d'),cx=size/2;
  const g=s.createLinearGradient(0,cx-sunR,0,cx+sunR);
  g.addColorStop(0,'#ffd319');g.addColorStop(0.45,'#ff8a00');g.addColorStop(1,'#ff00c8');
  s.fillStyle=g;s.beginPath();s.arc(cx,cx,sunR,0,7);s.fill();
  s.globalCompositeOperation='destination-out';
  let y=cx+sunR*0.02,band=3,gap=10;
  while(y<cx+sunR){s.fillRect(cx-sunR,y,sunR*2,band);y+=band+gap;band*=1.35;gap*=1.28;}
}
function buildScan(){
  scanC=document.createElement('canvas');scanC.width=Math.max(2,Math.floor(W));scanC.height=Math.max(2,Math.floor(H));
  const s=scanC.getContext('2d');
  s.fillStyle='rgba(0,0,0,0.14)';
  for(let y=0;y<H;y+=3)s.fillRect(0,y,W,1);
  const v=s.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.55)');
  s.fillStyle=v;s.fillRect(0,0,W,H);
}

/* ================= AUDIO ================= */
let AC=null,master,musicG,sfxG,muted=false,musicOn=false,nb=null,mStep=0,mNext=0;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
    musicG=AC.createGain();musicG.gain.value=0.45;musicG.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=0.9;sfxG.connect(master);
    mNext=AC.currentTime+0.1;
  }catch(e){AC=null;}
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.7;}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function noiseBuf(){
  if(nb)return nb;
  nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return nb;
}
function sfxLaser(){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator();o.type='square';
  o.frequency.setValueAtTime(920,t);o.frequency.exponentialRampToValueAtTime(240,t+0.08);
  const g=AC.createGain();g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+0.1);
}
function sfxBoom(big){
  if(!AC)return;const t=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf();
  const f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(big?900:1500,t);f.frequency.exponentialRampToValueAtTime(50,t+(big?1.2:0.35));
  const g=AC.createGain();g.gain.setValueAtTime(big?0.65:0.35,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+(big?1.3:0.4));
  s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+1.4);
}
function sfxPower(){
  if(!AC)return;const t=AC.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;
    const g=AC.createGain();const t0=t+i*0.06;
    g.gain.setValueAtTime(0.14,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.14);
    o.connect(g);g.connect(sfxG);o.start(t0);o.stop(t0+0.15);
  });
}
function sfxShield(){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(900,t+0.2);
  const g=AC.createGain();g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+0.26);
}
/* synthwave loop: bass + drums @132bpm */
const BASSP=[0,0,12,0, 3,3,15,3, 5,5,17,5, 10,7,3,0];
function playStep(step,t){
  const b=BASSP[step];
  if(b>=0){
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mtof(33+b);
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=340;
    const g=AC.createGain();g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(f);f.connect(g);g.connect(musicG);o.start(t);o.stop(t+0.22);
  }
  if(step%4===0){ // kick
    const o=AC.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);
    const g=AC.createGain();g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    o.connect(g);g.connect(musicG);o.start(t);o.stop(t+0.18);
  }
  if(step%4===2){ // snare-ish
    const s=AC.createBufferSource();s.buffer=noiseBuf();
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.8;
    const g=AC.createGain();g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    s.connect(f);f.connect(g);g.connect(musicG);s.start(t);s.stop(t+0.14);
  }
  if(step%2===1){ // hat
    const s=AC.createBufferSource();s.buffer=noiseBuf();
    const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6500;
    const g=AC.createGain();g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    s.connect(f);f.connect(g);g.connect(musicG);s.start(t);s.stop(t+0.06);
  }
}
function scheduleMusic(){
  if(!AC||!musicOn)return;
  const spb=60/132/2;
  while(mNext<AC.currentTime+0.15){playStep(mStep,mNext);mStep=(mStep+1)%16;mNext+=spb;}
}

/* ================= STATE ================= */
let state='title',paused=false,titleT=0,goT=0;
let score=0,dispScore=0,best=0,combo=0,comboT=0,wave=0;
let waveState='inter',waveDelay=1.2,waveMsg='',waveMsgT=0;
let spawnQueue=[],enemies=[],pBullets=[],eBullets=[],powerups=[],particles=[],shocks=[],popups=[];
let boss=null,slowT=0,timeScale=1,hitStop=0,shake=0,flash=0;
try{best=+localStorage.getItem('neonSparkBest')||0;}catch(e){}

const player={x:0,tx:0,y:0,lives:3,inv:0,fireCd:0,spread:0,shield:0,r:12};

function resetGame(){
  score=0;dispScore=0;combo=0;comboT=0;wave=0;
  enemies.length=0;pBullets.length=0;eBullets.length=0;powerups.length=0;
  particles.length=0;shocks.length=0;popups.length=0;
  boss=null;slowT=0;timeScale=1;hitStop=0;shake=0;flash=0;paused=false;
  player.x=player.tx=W/2;player.y=H*0.86;player.lives=3;player.inv=1.5;
  player.fireCd=0;player.spread=0;player.shield=0;
  waveState='inter';waveDelay=1.4;
}

function startGame(){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  resetGame();
  state='playing';
  musicOn=true;mStep=0;mNext=AC?AC.currentTime+0.1:0;
  waveMsg='WAVE 1';waveMsgT=2;
}
function gameOver(){
  state='gameover';goT=0;musicOn=false;
  flash=0.9;shake=Math.min(40,shake+25);
  sfxBoom(true);
  if(score>best){best=score;try{localStorage.setItem('neonSparkBest',best);}catch(e){}}
}
const mult=()=>1+Math.min(7,Math.floor(combo/5));

/* ================= FX HELPERS ================= */
function boom(x,y,c,n,pw){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=(60+Math.random()*280)*pw;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.4+Math.random()*0.7,max:1,r:1+Math.random()*2.5,c});
  }
  shocks.push({x,y,r:6,v:520*pw,life:0.45,max:0.45,c});
}
function popup(x,y,txt,c,size){popups.push({x,y,txt,c,size:size||16,life:1,max:1});}

function updateFx(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=(1-2.2*dt);p.vy*=(1-2.2*dt);
  }
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i];s.life-=dt;s.r+=s.v*dt;s.v*=(1-3*dt);
    if(s.life<=0)shocks.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];p.life-=dt*0.9;p.y-=40*dt;
    if(p.life<=0)popups.splice(i,1);
  }
  shake=Math.max(0,shake-shake*8*dt-4*dt);
  flash=Math.max(0,flash-flash*2.2*dt);
  if(waveMsgT>0)waveMsgT-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  dispScore+=(score-dispScore)*Math.min(1,dt*10);
}

/* ================= WAVES / ENEMIES ================= */
function startWave(n){
  wave=n;spawnQueue.length=0;
  if(n%5===0){
    const hp=30+n*8;
    boss={x:W/2,y:-160,ty:H*0.2,hp,max:hp,t:0,fireCd:2,phase:0,spiralA:0,spiralCd:0,dying:0,dieT:0,dieBoom:0};
    waveMsg='⚠ BOSS WAVE ⚠';waveMsgT=2.4;
    return;
  }
  const count=5+n*2;
  for(let i=0;i<count;i++){
    let type;const r=Math.random();
    if(n<3)type=r<0.7?'weaver':'diver';
    else type=r<0.4?'weaver':(r<0.7?'diver':'shooter');
    spawnQueue.push({t:i*0.45+Math.random()*0.3,type});
  }
  waveMsg='WAVE '+n;waveMsgT=2;
}
function spawnEnemy(type){
  const e={type,t:0,hp:1,x:W*0.15+Math.random()*W*0.7,y:-30,fireCd:1+Math.random()};
  if(type==='weaver'){e.amp=40+Math.random()*90;e.baseX=Math.max(e.amp+30,Math.min(W-e.amp-30,e.x));e.sp=70+Math.random()*70;}
  if(type==='diver'){e.sp=130+Math.random()*60;}
  if(type==='shooter'){e.ty=H*(0.12+Math.random()*0.2);e.drift=Math.random()*6.28;}
  enemies.push(e);
}
function killEnemy(e,idx){
  enemies.splice(idx,1);
  const col=e.type==='weaver'?'#ff2d95':(e.type==='diver'?'#00e5ff':'#ff8a00');
  boom(e.x,e.y,col,18,0.7);
  sfxBoom(false);
  shake=Math.min(30,shake+3);
  hitStop=Math.max(hitStop,0.045);
  combo++;comboT=3;
  const pts=(e.type==='weaver'?100:e.type==='diver'?150:200)*mult();
  score+=pts;
  popup(e.x,e.y,'+'+pts,col,14);
  if(Math.random()<0.18){
    const r=Math.random();
    powerups.push({x:e.x,y:e.y,vy:70,type:r<0.4?'spread':(r<0.75?'shield':'slow'),t:0});
  }
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.t+=dt;
    if(e.type==='weaver'){e.y+=e.sp*dt;e.x=e.baseX+Math.sin(e.t*2.3)*e.amp;}
    else if(e.type==='diver'){e.y+=e.sp*dt;e.sp+=60*dt;e.x+=(player.x-e.x)*Math.min(1,dt*2);}
    else{ // shooter
      e.y+=(e.ty-e.y)*Math.min(1,dt*2);
      e.x+=Math.sin(e.t*0.8+e.drift)*40*dt;
      e.fireCd-=dt;
      if(e.fireCd<=0&&e.y>20){
        const a=Math.atan2(player.y-e.y,player.x-e.x);
        eBullets.push({x:e.x,y:e.y+12,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:5,c:'#ff8a00'});
        e.fireCd=1.7+Math.random()*0.8;
      }
    }
    if(e.y>H*0.88){enemies.splice(i,1);continue;}
    // ram player
    const dx=e.x-player.x,dy=e.y-player.y;
    if(dx*dx+dy*dy<(player.r+14)*(player.r+14)){hitPlayer();boom(e.x,e.y,'#ff2d95',14,0.5);enemies.splice(i,1);}
  }
}
function updateBoss(dt){
  if(!boss)return;
  boss.t+=dt;
  if(boss.dying>0){
    boss.dieT+=dt;
    if(boss.dieBoom>0){
      boss.dieBoom-=dt;
      if(boss.dieBoom<=0){
        const w=Math.min(W*0.42,340);
        boom(boss.x+(Math.random()-0.5)*w,boss.y+(Math.random()-0.5)*w*0.4,
          ['#ff2d95','#ff8a00','#00e5ff','#76B900'][Math.floor(Math.random()*4)],22,1);
        sfxBoom(false);shake=Math.min(30,shake+6);hitStop=Math.max(hitStop,0.03);
        boss.dieBoom=0.11;
      }
    }
    if(boss.dieT>1.25){
      boom(boss.x,boss.y,'#ff2d95',90,2.2);
      boom(boss.x,boss.y,'#00e5ff',60,1.8);
      flash=1;shake=40;hitStop=0.22;sfxBoom(true);
      const pts=5000*mult();score+=pts;
      popup(boss.x,boss.y,'+'+pts,'#76B900',26);
      powerups.push({x:boss.x-40,y:boss.y,vy:70,type:'spread',t:0});
      powerups.push({x:boss.x+40,y:boss.y,vy:70,type:Math.random()<0.5?'shield':'slow',t:0});
      boss=null;waveState='inter';waveDelay=2.5;
    }
    return;
  }
  boss.y+=(boss.ty-boss.y)*Math.min(1,dt*1.5);
  boss.x=W/2+Math.sin(boss.t*0.6)*W*0.2;
  const frac=boss.hp/boss.max;
  boss.phase=frac>0.66?0:(frac>0.33?1:2);
  const w=Math.min(W*0.42,340);
  if(boss.phase===0){
    boss.fireCd-=dt;
    if(boss.fireCd<=0){
      const a=Math.atan2(player.y-boss.y,player.x-boss.x);
      for(let k=-2;k<=2;k++){
        const aa=a+k*0.22;
        eBullets.push({x:boss.x,y:boss.y+20,vx:Math.cos(aa)*210,vy:Math.sin(aa)*210,r:6,c:'#ff8a00'});
      }
      boss.fireCd=1.5;
    }
  }else if(boss.phase===1){
    boss.fireCd-=dt;
    if(boss.fireCd<=0){
      for(let k=0;k<18;k++){
        const a=k/18*6.283+boss.t;
        eBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:5,c:'#ff2d95'});
      }
      boss.fireCd=1.4;
    }
  }else{
    boss.spiralCd-=dt;
    if(boss.spiralCd<=0){
      boss.spiralA+=0.38;
      for(let k=0;k<2;k++){
        const a=boss.spiralA+k*Math.PI;
        eBullets.push({x:boss.x,y:boss.y+10,vx:Math.cos(a)*190,vy:Math.sin(a)*190,r:5,c:'#76B900'});
      }
      boss.spiralCd=0.07;
    }
  }
  // collision with player
  const dx=boss.x-player.x,dy=boss.y-player.y;
  if(dx*dx+dy*dy<(w/2+player.r)*(w/2+player.r))hitPlayer();
}
function updateWaves(dt){
  if(boss){updateBoss(dt);return;}
  if(waveState==='inter'){
    waveDelay-=dt;
    if(waveDelay<=0)startWave(wave+1);
    return;
  }
  for(let i=spawnQueue.length-1;i>=0;i--){
    spawnQueue[i].t-=dt;
    if(spawnQueue[i].t<=0){spawnEnemy(spawnQueue[i].type);spawnQueue.splice(i,1);}
  }
  if(spawnQueue.length===0&&enemies.length===0){waveState='inter';waveDelay=2.2;}
}

/* ================= PLAYER / BULLETS ================= */
function hitPlayer(){
  if(player.inv>0)return;
  if(player.shield>0){
    player.shield=0;sfxShield();
    boom(player.x,player.y,'#00e5ff',24,0.8);
    return;
  }
  player.lives--;player.inv=2;
  shake=Math.min(40,shake+16);hitStop=Math.max(hitStop,0.1);
  boom(player.x,player.y,'#ff2d95',45,1.3);
  sfxBoom(true);
  eBullets=eBullets.filter(b=>{const dx=b.x-player.x,dy=b.y-player.y;return dx*dx+dy*dy>220*220;});
  if(player.lives<=0)gameOver();
}
function updatePlayer(dt){
  const k=keys;
  let mv=0;
  if(k['a']||k['arrowleft'])mv-=1;
  if(k['d']||k['arrowright'])mv+=1;
  if(mv)player.tx=player.x+mv*99999; // keyboard handled separately below
  if(mv){player.x+=mv*560*dt;player.tx=player.x;}
  else player.x+=(player.tx-player.x)*Math.min(1,dt*10);
  player.x=Math.max(20,Math.min(W-20,player.x));
  player.inv=Math.max(0,player.inv-dt);
  player.spread=Math.max(0,player.spread-dt);
  player.shield=Math.max(0,player.shield-dt);
  // engine flame
  for(let i=0;i<2;i++)
    particles.push({x:player.x+(Math.random()-0.5)*7,y:player.y+13,
      vx:(Math.random()-0.5)*40,vy:120+Math.random()*120,
      life:0.25+Math.random()*0.2,max:0.45,r:1.5+Math.random()*2,
      c:Math.random()<0.5?'#ff8a00':'#00e5ff'});
  // auto fire
  player.fireCd-=dt;
  if(player.fireCd<=0){
    player.fireCd=player.spread>0?0.19:0.23;
    sfxLaser();
    const base=[0];
    if(player.spread>0)base.push(-0.26,0.26);
    for(const a of base){
      pBullets.push({x:player.x+a*8,y:player.y-18,vx:Math.sin(a)*640,vy:-Math.cos(a)*640,r:3.5,c:'#00e5ff'});
    }
  }
}
function updateBullets(dt){
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20){pBullets.splice(i,1);continue;}
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j],dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<18*18){
        hit=true;e.hp--;
        boom(b.x,b.y,'#00e5ff',5,0.3);
        if(e.hp<=0)killEnemy(e,j);
        break;
      }
    }
    if(!hit&&boss&&boss.dying<=0){
      const w=Math.min(W*0.42,340);
      const dx=boss.x-b.x,dy=boss.y-b.y;
      if(Math.abs(dx)<w/2&&dy<60&&dy>-40){
        hit=true;boss.hp--;
        boom(b.x,b.y,'#ff2d95',4,0.25);
        if(boss.hp<=0){boss.dying=1;boss.dieT=0;boss.dieBoom=0;}
      }
    }
    if(hit)pBullets.splice(i,1);
  }
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>H+30||b.y<-40||b.x<-30||b.x>W+30){eBullets.splice(i,1);continue;}
    const dx=b.x-player.x,dy=b.y-player.y;
    if(dx*dx+dy*dy<(player.r+b.r)*(player.r+b.r)){
      eBullets.splice(i,1);hitPlayer();
    }
  }
}
function updatePowerups(dt){
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.t+=dt;p.y+=p.vy*dt;
    if(p.y>H+30){powerups.splice(i,1);continue;}
    const dx=p.x-player.x,dy=p.y-player.y;
    if(dx*dx+dy*dy<30*30){
      powerups.splice(i,1);
      sfxPower();
      boom(p.x,p.y,p.type==='spread'?'#76B900':(p.type==='shield'?'#00e5ff':'#ff2d95'),16,0.5);
      if(p.type==='spread'){player.spread=10;popup(player.x,player.y-30,'SPREAD','#76B900',16);}
      else if(p.type==='shield'){player.shield=8;popup(player.x,player.y-30,'SHIELD','#00e5ff',16);}
      else{slowT=5;popup(player.x,player.y-30,'TIME WARP','#ff2d95',16);}
    }
  }
}

/* ================= DRAWING ================= */
function drawSky(){

}
function drawStars(){

}
function drawSun(y){
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,horizonY);ctx.clip();

  const gl=ctx.createRadialGradient(sx,y,sunR*0.3,sx,y,sunR*1.9);

  ctx.fillStyle=gl;ctx.fillRect(sx-sunR*2,y-sunR*2,sunR*4,sunR*4);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(sunCanvas,sx-sunCanvas.width/2,y-sunCanvas.height/2);

}
function drawMtn(pts,line,fill,off){
  ctx.save();ctx.translate(off,0);
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(const p of pts)ctx.lineTo(p.x,p.y);
  ctx.lineTo(W+80,horizonY+4);ctx.lineTo(-80,horizonY+4);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(const p of pts)ctx.lineTo(p.x,p.y);
  ctx.strokeStyle=line;ctx.lineWidth=1.5;
  ctx.shadowColor=line;ctx.shadowBlur=12;
  ctx.globalAlpha=0.8;ctx.stroke();
  ctx.restore();
}
function drawGrid(){
  const gy=horizonY;
  const fg=ctx.createLinearGradient(0,gy,0,H);
  fg.addColorStop(0,'#170335');fg.addColorStop(0.35,'#0b0120');fg.addColorStop(1,'#03000a');
  ctx.fillStyle=fg;ctx.fillRect(0,gy,W,H-gy);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(0,229,255,0.20)';ctx.lineWidth=1;
  const vp=W/2;
  for(let i=-14;i<=14;i++){
    ctx.beginPath();ctx.moveTo(vp+i*9,gy);ctx.lineTo(vp+i*(W/9),H+60);ctx.stroke();
  }
  const rows=14;
  for(let i=0;i<rows;i++){

}
function shipPath(s){
  ctx.beginPath();
  ctx.moveTo(0,-20*s);
  ctx.quadraticCurveTo(6*s,-8*s,16*s,10*s);
  ctx.lineTo(7*s,6*s);
  ctx.lineTo(0,12*s);
  ctx.lineTo(-7*s,6*s);
  ctx.lineTo(-16*s,10*s);
  ctx.quadraticCurveTo(-6*s,-8*s,0,-20*s);
  ctx.closePath();
}
function drawShipShape(x,y,s,color){
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor=color;ctx.shadowBlur=16;
  shipPath(s);
  ctx.fillStyle='rgba(0,18,40,0.92)';ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  ctx.shadowColor='#76B900';

  ctx.fillStyle='#76B900';ctx.fill();

}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  if(e.type==='weaver'){
    ctx.shadowColor='#ff2d95';ctx.shadowBlur=14;
    ctx.rotate(Math.sin(e.t*2)*0.3);
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(12,0);ctx.lineTo(0,14);ctx.lineTo(-12,0);ctx.closePath();
    ctx.fillStyle='rgba(60,0,30,0.9)';ctx.fill();
    ctx.strokeStyle='#ff2d95';ctx.lineWidth=2;ctx.stroke();
  }else if(e.type==='diver'){
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(11,-10);ctx.lineTo(0,-5);ctx.lineTo(-11,-10);ctx.closePath();
    ctx.fillStyle='rgba(0,35,55,0.9)';ctx.fill();
    ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;ctx.stroke();
  }else{
    ctx.shadowColor='#ff8a00';ctx.shadowBlur=14;
    ctx.rotate(e.t*0.7);
    ctx.beginPath();
    for(let k=0;k<6;k++){
      const a=k/6*6.283;
      const px=Math.cos(a)*13,py=Math.sin(a)*13;
      k?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(60,25,0,0.9)';ctx.fill();
    ctx.strokeStyle='#ff8a00';ctx.lineWidth=2;ctx.stroke();

/* ================= MAIN LOOP ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  time+=rdt;
  gridScroll=(gridScroll+rdt*0.5)%1;
  scheduleMusic();
  let dt=rdt;
  if(hitStop>0){hitStop-=rdt;dt=0;}
  else{
    const target=slowT>0?0.35:1;
    timeScale+=(target-timeScale)*Math.min(1,rdt*6);
    dt=rdt*timeScale;
  }
  if(state==='title'){titleT+=rdt;}
  else if(state==='gameover'){goT+=rdt;updateFx(dt||rdt*0.5);}
  else if(state==='playing'&&!paused){
    slowT=Math.max(0,slowT-dt);
    updatePlayer(dt);
    updateWaves(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePowerups(dt);
    updateFx(dt);
  }else if(state==='playing'&&paused){
    updateFx(0);
  }
  render();
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawSky();
  drawStars();
  if(state==='title'){
    drawTitle();
  }else{
    const ease=state==='gameover'?1:Math.min(1,titleT+99);
    drawSun(horizonY-sunR*0.35);
    drawMtn(mtnBack,'rgba(255,45,149,0.5)','#160b2e',Math.sin(time*0.05)*10);
    drawMtn(mtnFront,'rgba(0,229,255,0.55)','#0b0518',Math.sin(time*0.07+2)*14);
    drawGrid();
    drawEntities();
    drawFx();
    drawPopups();
    drawWaveMsg();
    drawHUD();
    if(state==='gameover')drawGameOver();
  }
  ctx.restore();
  drawOverlays();
  if(state==='playing'&&paused)drawPause();
}

function action(){
  if(state==='title')startGame();
  else if(state==='gameover'&&goT>0.8)startGame();
}
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(k===' '||k==='enter'){e.preventDefault();action();}
  if(k==='p'&&state==='playing')paused=!paused;
  if(k==='m')toggleMute();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('mousemove',e=>{
  if(state==='playing')player.tx=e.clientX;
});
window.addEventListener('mousedown',()=>{initAudio();action();});
window.addEventListener('touchstart',e=>{
  e.preventDefault();
  initAudio();
  const t=e.touches[0];
  if(state==='playing')player.tx=t.clientX;
  action();
},{passive:false});
window.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  if(state==='playing')player.tx=t.clientX;
},{passive:false});

resize();
player.x=player.tx=W/2;
player.y=H*0.86;
requestAnimationFrame(frame);
</script>
</body>
</html>
